apiVersion: v1
kind: ConfigMap
metadata:
  name: api-config
  namespace: gigahub
data:
  PORT: "3000"
  NODE_ENV: production
  GLOBAL_PREFIX: /api/v1
  JWT_ISSUER: gigahub
  JWT_AUDIENCE: gigahub-web
  JWT_ACCESS_TTL_SECONDS: "900"
  AUTH_COOKIE_NAME: gh_refresh
  AUTH_COOKIE_SECURE: "true"
  AUTH_COOKIE_SAME_SITE: lax
  MINIO_PORT: "9000"
  MINIO_USE_SSL: "false"
  MINIO_BUCKET: gigahub
  IXC_DB_PORT: "3306"
  IXC_DB_NAME: ixcprovedor
