services:
  mongodb:
    image: mongo:7.0
    container_name: gigahub-mongodb
    command: ["mongod", "--replSet", "rs0", "--bind_ip_all"]
    ports:
      - "27017:27017"
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      - mongodb_data:/data/db

  mongo-init-replica:
    image: mongo:7.0
    container_name: gigahub-mongo-init
    depends_on:
      mongodb:
        condition: service_healthy
    restart: "no"
    entrypoint:
      - /bin/sh
      - -c
      - |
        mongosh --host mongodb:27017 --eval '
          try {
            if (rs.status().ok === 1) {
              console.log("Replica set rs0 is already initialized");
            }
          } catch (e) {
            rs.initiate({
              _id: "rs0",
              members: [{ _id: 0, host: "127.0.0.1:27017" }]
            });
            console.log("Replica set rs0 initialized successfully");
          }
        '

  redis:
    image: redis:7-alpine
    container_name: gigahub-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      - redis_data:/data

  minio:
    image: minio/minio:latest
    container_name: gigahub-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      - minio_data:/data

  minio-init-bucket:
    image: minio/mc:latest
    container_name: gigahub-minio-init
    depends_on:
      minio:
        condition: service_healthy
    restart: "no"
    entrypoint:
      - /bin/sh
      - -c
      - |
        until mc alias set local http://minio:9000 minioadmin minioadmin; do
          echo "Waiting for MinIO..."
          sleep 1
        done
        mc mb --ignore-existing local/gigahub
        mc anonymous set download local/gigahub
        echo "Bucket gigahub created successfully."

volumes:
  mongodb_data:
  redis_data:
  minio_data:
